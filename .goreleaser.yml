version: 2

# Replaces the source-tarball Homebrew formula (inventory.md §9's "single
# biggest distribution change") with real per-platform compiled binaries.
# Windows is out of scope for this rewrite (spec FR-012) -- macOS + Linux
# only, matching plan.md's Target Platform and the hook-IPC subsystem's
# actual test coverage.

before:
  hooks:
    - go mod tidy

builds:
  - id: landfall
    main: ./cmd/landfall
    binary: landfall
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      # main.version is the ONLY place a release version is recorded --
      # cmd/landfall/main.go's own doc comment explains why (replaces
      # bin/landfall.mjs:487's hardcoded, already-stale '0.2.0' literal).
      - -s -w -X main.version={{.Version}}

archives:
  - id: landfall
    ids:
      - landfall
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  github:
    owner: landfalls-ai
    name: landfall-cli
  # goreleaser writes the release itself; the prior bump-homebrew-tap.yml
  # workflow's separate tag-triggered job is retired in favor of this one
  # pipeline doing build+release+tap-update together (see
  # .github/workflows/release.yml).

homebrew_casks:
  # `brews:` (the old Formula-publishing key) was formally removed in
  # goreleaser v2.16 -- homebrew_casks is the current, documented
  # replacement for distributing a plain compiled binary, and `brew install
  # landfall` works identically for the end user (goreleaser.com/deprecations
  # confirms this). Writes to Casks/landfall.rb in the tap, not
  # Formula/landfall.rb. The old Formula/landfall.rb was deleted from the tap
  # on 2026-08-23 once v0.6.0 shipped -- it had to go: Homebrew resolves a
  # bare `landfall` to the Formula first, so `brew upgrade landfall` sat
  # reporting "already installed" at the old Node v0.5.0 and never saw the
  # Cask at all.
  - name: landfall
    ids:
      - landfall
    binaries:
      - landfall
    repository:
      owner: landfalls-ai
      name: homebrew-landfall
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/landfalls-ai/landfall-cli"
    description: "Join a Landfall war room from your terminal"
    # No `depends_on "node"` and no npm install step -- this IS the biggest
    # behavioral change from today's formula. A compiled binary needs no
    # runtime dependency at all.
    commit_author:
      name: Jhonny
      email: jhonny@landfalls.ai
    commit_msg_template: "chore: bump landfall to {{ .Tag }}"
    # Strip the macOS quarantine xattr that Homebrew propagates from the
    # downloaded tarball onto the staged binary. Without this, v0.6.0
    # installed "successfully" but left a BROKEN SYMLINK: Homebrew staged
    # LICENSE/README into the Caskroom while the unsigned, un-notarized
    # `landfall` executable never landed there, so /opt/homebrew/bin/landfall
    # pointed at a nonexistent file. Reproduced on 4 consecutive clean
    # installs (macOS 26.4, Homebrew 6.0.18); the release archive itself was
    # always correct (verified: tar lists LICENSE, README.md, landfall) and
    # the binary ran fine once placed by hand, which is what isolated this to
    # quarantine handling rather than a bad build or a bad archive.
    # This is goreleaser's own documented workaround for distributing an
    # unsigned binary via a cask (goreleaser.com/customization/homebrew_casks).
    # It trades away a macOS verification layer, and Apple can disable it at
    # any time -- the durable fix is real code signing + notarization, which
    # needs a paid Apple Developer account. Tracked as a follow-up rather than
    # silently accepted as permanent.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/landfall"]
          end
