name: Bump Homebrew tap

# Automates RELEASING.md steps 4-6 (compute the release tarball's sha256,
# edit landfalls-ai/homebrew-landfall's Formula/landfall.rb, commit+push)
# for every version tag pushed here. Steps 1-3 (merge to main, bump
# package.json, cut+push the tag) stay a human decision — this workflow
# only reacts to a tag that already exists.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  bump-formula:
    # Guard against a fork ever running this against the real tap.
    if: github.repository == 'landfalls-ai/landfall-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: landfall
          homebrew-tap: landfalls-ai/homebrew-landfall
          # download-url defaults to this repo's own
          # archive/refs/tags/<tag>.tar.gz, which is exactly what
          # Formula/landfall.rb already points at — no override needed.
          commit-message: |
            landfall {{version}}
        env:
          # Fine-grained PAT, Contents: Read and write, scoped to
          # landfalls-ai/homebrew-landfall only. Push access to that one
          # repo is all this step needs. See RELEASING.md for setup.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
